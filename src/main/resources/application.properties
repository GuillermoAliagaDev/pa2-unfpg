spring.application.name=unfpg
server.port=8080

# Conexion a MySQL (base de datos universidad_unfpg)
# Cada integrante puede cambiar sus credenciales con variables de entorno
# (DB_URL, DB_USERNAME, DB_PASSWORD) sin modificar este archivo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/universidad_unfpg?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA: la base de datos ya existe, no se debe crear ni modificar tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
